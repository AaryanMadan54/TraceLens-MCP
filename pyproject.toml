[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-mcp"
version = "0.1.0"
description = "An evidence-first observability investigation agent with read-only MCP tools. Synthetic demo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastmcp>=2.14,<3", "openai>=2,<3", "pydantic>=2.11,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
tracelens = "tracelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracelens = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
